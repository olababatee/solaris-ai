body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header,.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top{justify-content:flex-start}
h1{margin:0;font-size:22px;cursor:pointer;user-select:none}h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:2px 0 0;font-size:13px}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;cursor:pointer;font:inherit}
.lang button.on{background:var(--acc);color:#1f1a10;border-color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 6px}
.row{display:grid;grid-template-columns:2fr 1fr .8fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.row.head{color:var(--mute);font-size:12px}

.x{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer}
.btn{background:var(--acc);color:#1f1a10;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
.btn.ghost{background:none;border:1px dashed var(--line);color:var(--ink)}
.set{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.res{display:grid;gap:10px}

.res .kpi{margin:0}.kpi b{font-size:21px;color:var(--acc2)}.kpi small{display:block;color:var(--mute);font-size:12px}
.kpi.lock{justify-content:center;color:var(--mute);text-align:center}
.warn{background:rgba(245,158,11,.15);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.tot{color:var(--mute);font-size:13px;margin-top:8px;word-break:break-all}

.m{max-width:85%;padding:8px 11px;border-radius:12px;font-size:14px;white-space:pre-wrap}

</style>
</head>

const ownerDev=()=>{try{return localStorage.getItem("sp_owner")==="1"}catch(e){return false}};
function refresh(){const L=lic();$("adm").hidden=!(ADMIN||ownerDev());$("crs").hidden=!premium();const locked=!premium();document.body.classList.toggle("locked",locked);$("gate").hidden=!locked;if(locked)drawGate();$("up").hidden=!(L&&!ADMIN);$("up").textContent="✓ "+t("lifetime");
  $("ci").placeholder=t("aiPh");$("foot").innerHTML=[CFG.terms&&`<a href="${esc(https(CFG.terms))}" target="_blank" rel="noopener">${t("terms")}</a>`,CFG.privacy&&`<a href="${esc(https(CFG.privacy))}" target="_blank" rel="noopener">${t("privacy")}</a>`].filter(Boolean).join(" · ");render()}

/* ===== payments: Paystack Inline popup (public key only) ===== */
function loadPS(ok,bad){if(window.PaystackPop)return ok();const s=document.createElement("script");s.src="https://js.paystack.co/v1/inline.js";s.onload=ok;s.onerror=bad;document.head.appendChild(s)}
function mockup(){
  const f=n=>Math.round(n).toLocaleString(lang),wh=1900,w=310,V=48,inv=INV.find(x=>x>=w*1.25),bWh=wh/(.5*CFG.eff),pn=Math.ceil((wh/CFG.eff)/(5*CFG.loss)/400),k=(a,b,c)=>`<div class="kpi"><div>${a}<small>${c||""}</small></div><b>${b}</b></div>`;
  return`<div class="mock" aria-hidden="true"><div class="bar"><i></i><i></i><i></i><span>${t("sample")}</span></div><div class="in">`+
   k(t("totalWatt"),f(w)+" W",t("daily")+": "+f(wh)+" Wh")+k(t("inverter"),f(inv)+" W","×1.25")+k(t("battery"),f(bWh/V)+" Ah",V+" V · "+(bWh/1000).toFixed(1)+" kWh")+k(t("panels"),pn+" × 400 W",t("array")+": "+f(pn*400)+" Wp")+k(t("ctrl"),Math.ceil(pn*400/V*1.25)+" A","")+
   `</div><div class="cap">${t("sampleCap")}</div></div>`}
function drawGate(){
  const L=lic(),old=$("pe")?$("pe").value:"";
  $("gate").innerHTML=`<div class="gate"><h2>☀️ ${t("gateTitle")}</h2><p class="sub">${t("gateSub")}</p>${mockup()}<ul><li>${t("f1")}</li><li>${t("f2")}</li><li>${t("f3")}</li></ul>
   <label>${t("email")}</label><input id="pe" type="email" autocomplete="email" value="${esc(old||(L?L.e:""))}"><div style="height:10px"></div>
   <div class="kpi"><div>${t("lifetime")}<small>${t("once")}</small></div><b>${money(CFG.price)}</b><button class="btn" id="buy">${t("buy")}</button></div>
   <div class="tot">${t("secure")}</div><div id="pm" class="tot"></div><h3>${t("restore")}</h3><div style="display:flex;gap:6px"><input id="rk" placeholder="${t("keyPh")}"><button class="btn ghost" id="rb">${t("restoreBtn")}</button></div></div>`;
  $("buy").onclick=buy;
  $("rb").onclick=()=>{const o=dec($("rk").value);if(!o||o.p==="course")return $("pm").textContent=t("badKey");store(o);refresh()};
}
const showPlans=()=>{if(!premium())drawGate()};
function startPay(kind,em,m){
  if(!/^\S+@\S+\.\S+$/.test(em))return m(t("needEmail"));if(!CFG.pk)return m(t("noPay"));
  const price=kind==="course"?CFG.coursePrice:CFG.price;
  loadPS(()=>{PaystackPop.setup({key:CFG.pk,email:em,amount:Math.round(price*100),currency:CFG.cur,ref:(kind==="course"?"SC":"SP")+Date.now().toString(36)+Math.random().toString(36).slice(2,8),metadata:{plan:kind},
    callback:function(r){const o={e:em,p:kind,r:r.reference,x:Date.now()+36500*864e5};store(o);refresh();
      modal(`<h2>✓ ${t("thanks")}</h2><h3>${t("keyTitle")}</h3><div class="tot" style="user-select:all">${esc(enc(o))}</div><div class="tot">${t("keyHelp")}</div>`+(kind==="course"?`<p><button class="btn" id="oc">${t("courseTitle")}</button></p>`:""));
      if(kind==="course")$("oc").onclick=showCourse},onClose:function(){}}).openIframe()},()=>m(t("payErr")));
}
const buy=()=>startPay("lifetime",$("pe").value.trim(),x=>$("pm").textContent=x);

/* ===== course: lessons come from the server (only paying students receive the video links) ===== */
function linksHtml(l){const a=(l.links||[]).filter(k=>/^https:\/\/\S+$/.test(k.url||""));
  return a.length?`<div class="tot"><b>${t("freeVids")}</b></div>`+a.map(k=>`<div class="tot">▶ <a href="${esc(k.url)}" target="_blank" rel="noopener noreferrer">${esc(k.title)}</a> · ${esc(k.by||"")}</div>`).join(""):""}
function vid(u){u=String(u||"");const m=u.match(/^https:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  if(m)return`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" title="Lesson video" loading="lazy" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px"></iframe>`;
  if(/^https:\/\/[^\s"'<>]+\.mp4(\?[^\s"'<>]*)?$/i.test(u))return`<video controls preload="none" src="${esc(u)}" style="width:100%;border-radius:10px"></video>`;
  return`<div class="tot">${t("soon")}</div>`}
async function showCourse(){
  const L=courseLic();if(L)return loadCourse(L);
  modal(`<h2>🎓 ${t("courseTitle")}</h2><p class="sub">${t("courseSub")}</p><div id="cpv" class="tot"></div><div class="tot">⚠️ ${t("courseSafety")}</div>
   <label style="margin-top:10px">${t("email")}</label><input id="ce" type="email" autocomplete="email" value="${esc((lic()||{}).e||"")}"><div style="height:10px"></div>
   <div class="kpi"><div>${t("courseTitle")}<small>${t("courseOnce")}</small></div><b>${money(CFG.coursePrice)}</b><button class="btn" id="cbuy">${t("buy")}</button></div>
   <div class="tot">${t("secure")}</div><div id="cm" class="tot"></div><h3>${t("restore")}</h3><div style="display:flex;gap:6px"><input id="ck" placeholder="${t("keyPh")}"><button class="btn ghost" id="crb">${t("restoreBtn")}</button></div>`);
  $("cbuy").onclick=()=>startPay("course",$("ce").value.trim(),x=>$("cm").textContent=x);
  $("crb").onclick=()=>{const o=dec($("ck").value);if(!o||o.p!=="course")return $("cm").textContent=t("badKey");store(o);showCourse()};
  try{const r=await fetch("/.netlify/functions/course"),j=await r.json();if(j&&j.modules)$("cpv").innerHTML=j.modules.map(m=>`<b>${esc(m.title)}</b><br>`+m.lessons.map(l=>"• "+esc(l.title)).join("<br>")).join("<br><br>")}catch(e){}
}
async function loadCourse(L){
  modal(`<h2>🎓 ${t("courseTitle")}</h2><div class="tot">${t("loadingC")}</div>`);
  try{
    const r=await fetch("/.netlify/functions/course",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref:L.r})}),j=await r.json().catch(()=>null);
    if(!r.ok||!j||!j.modules)throw new Error("load");
    const CL=[];
    modal(`<h2>🎓 ${t("courseTitle")}</h2><div class="tot">⚠️ ${t("courseSafety")}</div>`+j.modules.map(m=>`<h3>${esc(m.title)}</h3>`+m.lessons.map(l=>{CL.push(l);
      return`<div class="kpi" style="display:block"><b style="font-size:15px;color:var(--ink)">${esc(l.id)} · ${esc(l.title)}</b><div class="tot">${esc(l.summary||"")}</div><div style="margin:8px 0">${l.video||!(l.links&&l.links.length)?vid(l.video):""}</div>${linksHtml(l)}<button class="btn ghost" data-ask="${CL.length-1}">${t("askAI")}</button></div>`}).join("")).join(""));
    document.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>{const l=CL[+b.dataset.ask];closeM();$("chat").classList.add("open");if(!$("msgs").children.length)say(t("hello"),"bot");$("ci").value="Teach me lesson "+l.id+" ("+l.title+") step by step.";send()});
  }catch(e){modal(`<h2>🎓 ${t("courseTitle")}</h2><div class="tot">${t("courseErr")}</div>`)}
}

/* ===== help chat: answers from the FAQ you write in Admin (no AI, no server) ===== */
const say=(x,w)=>{const d=document.createElement("div");d.className="m "+w;d.textContent=x;$("msgs").appendChild(d);$("msgs").scrollTop=1e9;return d};
function answer(q){q=q.toLowerCase();for(const ln of CFG.faq.split("\n")){const i=ln.indexOf("|");if(i>0&&ln.slice(0,i).split(",").some(w=>w.trim()&&q.includes(w.trim().toLowerCase())))return ln.slice(i+1).trim()}return t("noAns")}
const hist=[];
function ctxText(){const r=size();let x="Appliances: "+rows.slice(0,20).map(a=>`${String(a.name).slice(0,30)} ${+a.watts||0}W x${+a.qty||0} ${+a.hours||0}h/day`).join("; ");
  x+=`\nSettings: sun hours ${$("psh").value}, ${$("volt").value}V, inverter buffer ${$("buf").value}, DoD ${$("dod").value}%, autonomy ${$("aut").value} days, panel ${$("pw").value}W`;
  if(r)x+=`\nResults: ${Math.round(r.wh)} Wh/day, ${Math.round(r.w)} W load, inverter ${r.inv} W, battery ${r.bAh} Ah, ${r.panels} panels (${r.wp} Wp), controller ${r.ctrl} A`;return x}
async function send(){
  const v=$("ci").value.trim();if(!v)return;$("ci").value="";say(v,"me");const w=say("…","bot"),L=lic();
  if(!L||!/^SP[a-z0-9]{6,40}$/i.test(L.r||"")){w.textContent=t("aiNeedPay");return}
  hist.push({role:"user",content:v});
  try{
    const r=await fetch("/.netlify/functions/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref:L.r,course:(courseLic()||{}).r,messages:hist.slice(-10),ctx:ctxText()})}),j=await r.json().catch(()=>null);
    if(r.ok&&j&&j.reply){hist.push({role:"assistant",content:j.reply});w.textContent=j.reply}
    else if(r.status===402)w.textContent=t("aiNeedPay");
    else if(r.status===429||r.status===504)w.textContent=t("aiBusy");
    else w.textContent=answer(v); // AI not set up yet or temporarily down: use your offline answers
  }catch(e){w.textContent=answer(v)}
  if(hist.length>20)hist.splice(0,hist.length-20);$("msgs").scrollTop=1e9;
}
$("fab").onclick=()=>{$("chat").classList.toggle("open");if(!$("msgs").children.length)say(t("hello"),"bot")};
$("cs").onclick=send;$("ci").onkeydown=e=>{if(e.key==="Enter")send()};
$("crs").onclick=showCourse;
$("up").onclick=()=>{const L=lic();if(L)modal(`<h2>${t("keyTitle")}</h2><div class="tot" style="user-select:all">${esc(enc(L))}</div><div class="tot">${t("keyHelp")}</div>`)};$("adm").onclick=()=>ADMIN?showAdmin():adminLogin();

/* ===== admin: tap the logo 5 times (or open #admin). Edits are exported as config.json for YOUR host. ===== */
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("solaris:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"p:"+s}}
let taps=0,tt;$("logo").onclick=()=>{clearTimeout(tt);if(++taps>=5){taps=0;adminLogin()}tt=setTimeout(()=>taps=0,2500)};
function adminLogin(){
  const first=!CFG.adminHash;
  modal(`<h2>Admin</h2><label>${first?"Create an admin password (8+ characters)":"Admin password"}</label><input id="ap" type="password"><p><button class="btn" id="ag">${first?"Create & open":"Open"}</button> <span id="am" class="tot"></span></p>`);
  $("ag").onclick=async()=>{const v=$("ap").value;if(v.length<8&&first)return $("am").textContent="8+ characters";
    if(first)CFG.adminHash=await sha(v);else if(await sha(v)!==CFG.adminHash)return $("am").textContent="Wrong password";
    ADMIN=true;try{localStorage.setItem("sp_owner","1")}catch(e){}refresh();showAdmin()};
}
function showAdmin(){
  const i=(id,v,ty="text")=>`<input id="${id}" type="${ty}" value="${esc(v)}">`;
  modal(`<h2>⚙ Admin</h2><h3>Paystack</h3><label>Public key from Paystack Dashboard → Settings → API Keys &amp; Webhooks (pk_test_… / pk_live_…). Never paste your secret key here.</label>${i("apk",CFG.pk)}<div class="tot">Status: ${CFG.pk?"✓ key set - customers can pay with Paystack":"✗ no key yet - Upgrade will say payments are not set up"}</div>
   <h3>One-time price (lifetime access)</h3>${i("aprice",CFG.price,"number")}<div class="tot">Suggested starting point: ₦10,000 to ₦20,000 for technicians and installers. Adjust to what your customers accept.</div><h3>Course price (one-time)</h3>${i("acp",CFG.coursePrice,"number")}<div class="tot">Add your lesson videos by editing course.js on GitHub (links stay private; only paying students receive them).</div><div class="set"><div><label>Currency (must be enabled on your Paystack)</label><select id="acur">${["NGN","GHS","ZAR","KES","USD"].map(c=>`<option${c===CFG.cur?" selected":""}>${c}</option>`).join("")}</select></div>
   <div><label>Inverter efficiency (0.5-1)</label>${i("aef",CFG.eff,"number")}</div><div><label>System losses factor (0.4-1)</label>${i("als",CFG.loss,"number")}</div>
   <div><label>Terms URL (https)</label>${i("atl",CFG.terms)}</div><div><label>Privacy URL (https)</label>${i("apr",CFG.privacy)}</div></div>
   <h3>Solaris AI knowledge: paste new information, rules or corrections (used by the AI after you upload config.json)</h3><textarea id="aai" rows="5">${esc(CFG.aiNotes)}</textarea>
   <h3>Offline fallback answers (used only if the AI is unavailable): keyword1, keyword2 | answer</h3><textarea id="afq" rows="5">${esc(CFG.faq)}</textarea>
   <h3>New admin password (optional)</h3><input id="anp" type="password" placeholder="leave empty to keep">
   <p><button class="btn" id="adl">Download config.json</button> <button class="btn ghost" id="aap">Apply here</button> <button class="btn ghost" id="acu">Test as customer</button></p><p><button class="btn ghost" id="alo">Log out</button> <button class="btn ghost" id="afg">Hide Admin button on this device</button></p>
   <div class="tot">Upload the downloaded <b>config.json</b> next to this HTML file on your host. Customers get your changes after that; nothing changes for them before.</div>
   <h3>Manual licence key (bank transfer / gift)</h3><div style="display:flex;gap:6px"><input id="ke" placeholder="customer email"><button class="btn ghost" id="kg">Make</button></div><div id="ko" class="tot" style="user-select:all"></div>`);
  const read=async()=>{CFG.pk=$("apk").value.trim();CFG.cur=$("acur").value;CFG.eff=clamp($("aef").value,.5,1,.9);CFG.loss=clamp($("als").value,.4,1,.75);
    CFG.price=clamp($("aprice").value,100,1e7,CFG.price);CFG.coursePrice=clamp($("acp").value,100,1e7,CFG.coursePrice);
    CFG.terms=https($("atl").value.trim());CFG.privacy=https($("apr").value.trim());CFG.faq=$("afq").value.slice(0,4000);CFG.aiNotes=$("aai").value.slice(0,4000);if($("anp").value.length>=8)CFG.adminHash=await sha($("anp").value);refresh()};
  $("aap").onclick=async()=>{await read();closeM()};
  $("alo").onclick=()=>{ADMIN=false;refresh();closeM()};
  $("afg").onclick=()=>{try{localStorage.removeItem("sp_owner")}catch(e){}ADMIN=false;refresh();closeM()};
  $("acu").onclick=async()=>{await read();ADMIN=false;closeM();refresh()};
  $("adl").onclick=async()=>{await read();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(CFG,null,2)],{type:"application/json"}));a.download="config.json";a.click()};
  $("kg").onclick=()=>{const e=$("ke").value.trim();if(e)$("ko").textContent=enc({e,p:"lifetime",r:"manual",x:Date.now()+36500*864e5})};
}

/* ===== start ===== */
drawRows();
fetch("config.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null).then(c=>{if(c&&typeof c==="object"){CFG={...DEF,...c};delete CFG.plans;CFG.price=clamp(CFG.price,100,1e7,DEF.price);CFG.coursePrice=clamp(CFG.coursePrice,100,1e7,DEF.coursePrice)}
  setLang("en");if(location.hash==="#admin")adminLogin()});
</script>
</body>
</html>
